<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raven Matrix Trainer — test harness</title>
<style>
  body { font: 12px sans-serif; margin: 8px; background: #fff; }
  .sheet { display: grid; grid-template-columns: repeat(2, 640px); gap: 18px; }
  .pz { border: 1px solid #ccc; padding: 6px; }
  .pz h4 { margin: 0 0 4px; font-size: 12px; }
  .row { display: flex; gap: 4px; }
  .m { display: grid; grid-template-columns: repeat(3, 84px); gap: 3px; }
  .m.m2 { grid-template-columns: repeat(2, 128px); }
  .o { display: grid; grid-template-columns: repeat(4, 76px); gap: 3px; align-content: start; margin-left: 10px; }
  .m > div, .o > div { border: 1px solid #ddd; position: relative; }
  .m svg, .o svg { width: 100%; display: block; }
  .o > div.ok { outline: 3px solid #16a34a; }
  .o span { position: absolute; left: 2px; top: 0; font-size: 9px; color: #888; }
  .q { display: flex; align-items: center; justify-content: center; font-size: 30px; color: #93c5fd; }
</style>
</head>

<div id="out"></div>

<script>
  window.showSheet = function (list, blind) {
    const out = document.getElementById('out');
    out.innerHTML = '<div class="sheet">' + list.map(function (P) {
      const head = blind ? 'Puzzle #' + P.num + (P.reading === 'sequence' ? ' (SEQUENCE: read panels left→right, top→bottom)' : P.size === 2 ? ' (2×2 ANALOGY: A is to B as C is to ?)' : '')
        : '#' + (P.num || '-') + ' ' + P.famId + ' v' + P.variant + ' ★' + P.difficulty + ' (ans ' + (P.answerIndex + 1) + ')';
      return '<div class="pz"><h4>' + head + '</h4><div class="row"><div class="m' + (P.size === 2 ? ' m2' : '') + '">' +
        P.panels.map(function (s) { return '<div>' + s + '</div>'; }).join('') + '<div class="q">?</div></div><div class="o">' +
        P.options.map(function (s, i) { return '<div class="' + (!blind && i === P.answerIndex ? 'ok' : '') + '"><span>' + (i + 1) + '</span>' + s + '</div>'; }).join('') +
        '</div></div></div>';
    }).join('') + '</div>';
  };
</script>
